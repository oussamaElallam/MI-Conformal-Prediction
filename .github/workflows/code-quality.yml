name: Code quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-and-split-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn pytest
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run group-split tests
        run: pytest -q tests/test_data_splitting.py
      - name: Reject machine-local requirements
        run: |
          if grep -R "file:///" requirements*.txt; then
            echo "Machine-local package path found in requirements" >&2
            exit 1
          fi
