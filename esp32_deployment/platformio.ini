[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Default app build excludes the benchmark file (both define setup()/loop())
build_src_filter = +<*> -<main_benchmark.cpp>

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, default

; S3 Specific USB/Serial settings
build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

upload_speed = 921600

; Enable PSRAM settings for XIAO S3 (OPI)
board_build.arduino.memory_type = qio_opi
board_build.partitions = huge_app.csv
board_build.psram_type = opi

lib_deps = 
    ; This version includes FlatBuffers and necessary headers automatically
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0
; ---------------------------------------------------------------------------
; On-device benchmark build (Reviewer #6 metrics): latency stats, arena_used_bytes,
; SRAM high-water, preprocessing/end-to-end timing, and a continuous power mode.
; Builds ONLY src/main_benchmark.cpp.
;   pio run -e seeed_xiao_esp32s3_benchmark -t upload && pio device monitor
; ---------------------------------------------------------------------------
[env:seeed_xiao_esp32s3_benchmark]
extends = env:seeed_xiao_esp32s3
build_src_filter = -<*> +<main_benchmark.cpp>
